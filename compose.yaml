name: tcc-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Execute npm run setup:env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
